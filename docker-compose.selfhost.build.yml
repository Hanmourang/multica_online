# Development override: build the backend/web images from the current checkout
# instead of pulling the official GHCR images.

services:
  backend:
    image: multica-backend:dev
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        DATE: ${DATE:-unknown}
    # Stamped so `scripts/selfhost-local.sh verify` can prove the running
    # container was built from this checkout instead of an upstream pull.
    labels:
      org.opencontainers.image.revision: ${COMMIT:-unknown}
      org.opencontainers.image.version: ${VERSION:-dev}
      com.multica.source: selfhost-local

  frontend:
    image: multica-web:dev
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_APP_VERSION: ${VERSION:-dev}
    labels:
      org.opencontainers.image.revision: ${COMMIT:-unknown}
      org.opencontainers.image.version: ${VERSION:-dev}
      com.multica.source: selfhost-local
